name: derper

services:
  derper:
    image: ghcr.io/mrleecha/derper:latest
    container_name: derper
    restart: unless-stopped

    # DERP needs real client source IPs and direct UDP for STUN.
    # On Linux this is the recommended mode; do not also set `ports:`.
    network_mode: host

    environment:
      DERP_HOSTNAME: derp.example.com
      DERP_CERT_FILE: /certs/fullchain.cer
      DERP_KEY_FILE: /certs/derp.example.com.key
      DERP_ADDRESS: ":8443"

      # Optional:
      # DERP_STUN: "true"
      # DERP_STUN_PORT: "3478"
      # DERP_VERIFY_CLIENT_URL: https://hs.example.com/verify
      # DERP_VERIFY_CLIENT_URL_FAIL_OPEN: "false"
      # DERP_EXTRA_ARGS: ""

    volumes:
      # Certificate sources (read-only).
      - ./certs:/certs:ro
      # Persistent derper node key + the normalized certificate copies.
      - ./data:/var/lib/derper

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Bridge-network fallback (not recommended: source IPs are NATed):
    # ports:
    #   - "8443:8443/tcp"   # or your DERP_ADDRESS port
    #   - "3478:3478/udp"
